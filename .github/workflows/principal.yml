name: Commit e PR - Principal

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ principal ]

# Minimal permissions needed for tests and posting results
# Note: For fork PRs, GitHub automatically restricts write permissions for security
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
    # Checkout PR code (safe with pull_request trigger - no secrets exposed)
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Maneira tradicional de build, sem cobertura.
    # Usado quando o `jest-coverage-report-action` dá problema.
    # - name: NPM - Dependências
    #   run: |
    #     sudo npm install
    # - name: Testes unitários
    #   run: |
    #     sudo npm run testes-unitarios

    # Run tests with coverage for all PRs (forks and same-repo)
    - uses: ArtiomTr/jest-coverage-report-action@v2
      id: coverage
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        test-script: yarn testes-unitarios
        package-manager: yarn
        output: report-markdown

    # Post coverage comment (action handles permissions automatically)
    - uses: marocchino/sticky-pull-request-comment@v2
      with:
        message: ${{ steps.coverage.outputs.report }}
